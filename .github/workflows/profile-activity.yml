name: Refresh public activity panel

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-activity.yml"

permissions:
  contents: write

concurrency:
  group: public-activity-panel
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build activity panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: navyareddy200708-collab
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape

          user = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/users/{user}/events/public?per_page=10",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "profile-activity-panel",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  events = json.load(response)
          except Exception as exc:
              raise SystemExit(f"Could not fetch public events: {exc}")

          rows = []
          for event in events[:5]:
              event_type = event.get("type", "Activity")
              repo = event.get("repo", {}).get("name", "")
              created = event.get("created_at", "")
              try:
                  day = datetime.fromisoformat(created.replace("Z", "+00:00")).strftime("%d %b %Y")
              except ValueError:
                  day = "Date unavailable"
              label = {
                  "PushEvent": "Pushed commits",
                  "CreateEvent": "Created a branch or repository",
                  "PullRequestEvent": "Updated a pull request",
                  "IssuesEvent": "Worked on an issue",
                  "IssueCommentEvent": "Commented on an issue",
                  "WatchEvent": "Starred a repository",
                  "ForkEvent": "Forked a repository",
                  "PublicEvent": "Made a repository public",
              }.get(event_type, event_type.removesuffix("Event") or "Activity")
              rows.append((label, repo, day))

          lines = []
          y = 94
          for label, repo, day in rows:
              lines.append(
                  f'<circle cx="32" cy="{y-5}" r="4" fill="#63E6D1"/>'
                  f'<text x="48" y="{y}" fill="#F1EEE5" font-size="14">{escape(label)}</text>'
                  f'<text x="48" y="{y+20}" fill="#9AABC2" font-size="12">{escape(repo)} · {escape(day)}</text>'
              )
              y += 52

          if not lines:
              lines.append('<text x="32" y="100" fill="#C0CAD9" font-size="14">No recent public events returned by GitHub.</text>')

          height = max(150, y + 6)
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="{height}" viewBox="0 0 900 {height}" role="img" aria-labelledby="title desc">
            <title id="title">Recent public GitHub activity</title>
            <desc id="desc">The latest public GitHub events available from the GitHub events API.</desc>
            <rect width="900" height="{height}" rx="16" fill="#080D19"/>
            <rect width="900" height="{height}" rx="16" fill="none" stroke="#263852"/>
            <text x="28" y="35" fill="#63E6D1" font-family="monospace" font-size="12" letter-spacing="2">PUBLIC ACTIVITY / LIVE SNAPSHOT</text>
            <text x="28" y="59" fill="#9AABC2" font-family="monospace" font-size="11">Generated {datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}</text>
            {''.join(lines)}
          </svg>'''
          os.makedirs("assets", exist_ok=True)
          with open("assets/public-activity.svg", "w", encoding="utf-8") as file:
              file.write(svg)
          PY

      - name: Commit generated panel if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/public-activity.svg
          if git diff --cached --quiet; then
            echo "Activity panel is unchanged."
            exit 0
          fi
          git commit -m "chore: refresh public activity panel [skip ci]"
          git push
