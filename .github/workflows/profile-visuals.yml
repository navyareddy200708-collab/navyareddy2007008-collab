name: Refresh profile visuals

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-visuals.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: navyareddy200708-collab
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=%2363E6D1&color_dots=%23111B31,%23243B55,%23418B89,%2363E6D1,%239B9BFF
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2363E6D1&color_dots=%23080D19,%23111B31,%23224350,%2363E6D1,%239B9BFF

      - name: Commit generated SVGs when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution SVGs are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh contribution animation [skip ci]"
          git push
