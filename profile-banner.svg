<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Navya Reddy — Developer</title>
  <desc id="desc">A midnight navy technical banner with a subtle grid, teal circuit paths, indigo orbital geometry, and the text Computer Science Engineering student, developer, applied AI explorer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D19"/>
      <stop offset="0.62" stop-color="#111B31"/>
      <stop offset="1" stop-color="#0B1222"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63E6D1"/>
      <stop offset="1" stop-color="#9B9BFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7C91B5" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#63E6D1" stop-opacity=".15"/>
      <stop offset="1" stop-color="#63E6D1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <ellipse cx="1010" cy="155" rx="300" ry="240" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="1.4" stroke-opacity=".7">
    <path d="M780 0V58H850V105H930"/>
    <path d="M1200 75H1118V120H1065V175H1005"/>
    <path d="M1200 275H1110V240H1040V215H980"/>
    <path d="M830 360V300H890V270H950"/>
    <path d="M910 40C1010 40 1080 105 1080 180S1010 320 910 320"/>
    <path d="M945 65C1018 65 1060 115 1060 180S1018 295 945 295" stroke-opacity=".38"/>
  </g>
  <g fill="#63E6D1">
    <circle cx="780" cy="58" r="3.5"/><circle cx="930" cy="105" r="3.5"/>
    <circle cx="1005" cy="175" r="3.5"/><circle cx="980" cy="215" r="3.5"/>
    <circle cx="950" cy="270" r="3.5"/><circle cx="830" cy="300" r="3.5"/>
  </g>
  <g transform="translate(74 62)">
    <rect x="0" y="0" width="44" height="3" rx="1.5" fill="#63E6D1"/>
    <text x="0" y="35" fill="#9AB0C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3">ENGINEERING / PORTFOLIO</text>
    <text x="0" y="112" fill="#F1EEE5" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-1.8">Navya Reddy</text>
    <text x="2" y="154" fill="#63E6D1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Computer Science Engineering</text>
    <text x="2" y="188" fill="#C0CAD9" font-family="Arial, Helvetica, sans-serif" font-size="17">Building useful software. Exploring applied AI.</text>
    <g transform="translate(0 232)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <rect width="118" height="28" rx="14" fill="#63E6D1" fill-opacity=".1" stroke="#63E6D1" stroke-opacity=".55"/>
      <text x="59" y="18" fill="#B8F8EE" text-anchor="middle">WEB SYSTEMS</text>
      <rect x="130" width="100" height="28" rx="14" fill="#9B9BFF" fill-opacity=".1" stroke="#9B9BFF" stroke-opacity=".55"/>
      <text x="180" y="18" fill="#D6D6FF" text-anchor="middle">APPLIED AI</text>
      <rect x="242" width="100" height="28" rx="14" fill="#F1EEE5" fill-opacity=".04" stroke="#9AB0C8" stroke-opacity=".5"/>
      <text x="292" y="18" fill="#D0D9E6" text-anchor="middle">LEARN / BUILD</text>
    </g>
  </g>
  <text x="1125" y="326" fill="#9AB0C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end" letter-spacing="2">NR / 2026</text>
  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="21.25" fill="none" stroke="#8298B8" stroke-opacity=".25" stroke-width="1.5"/>
</svg>